services:
  polisproof:
    build:
      context: .
      target: runtime
    ports:
      - "8080:8080"
    environment:
      POLISPROOF_MODE: ${POLISPROOF_MODE:-replay}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_NAME: ${LLM_NAME:-swiss-ai/Apertus-8B-Instruct-2509:publicai}
      LLM_NAME_8B: ${LLM_NAME_8B:-swiss-ai/Apertus-8B-Instruct-2509:publicai}
      LLM_NAME_70B: ${LLM_NAME_70B:-swiss-ai/Apertus-70B-Instruct-2509:featherless-ai}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-1200}
